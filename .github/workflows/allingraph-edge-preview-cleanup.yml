name: Temporary AllInGraph Edge release cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/allingraph-edge-preview-cleanup.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete temporary preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE /repos/${{ github.repository }}/releases/359919856
