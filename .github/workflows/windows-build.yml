name: Cross-platform build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'release/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            build_script: build:win
          - platform: linux-x64
            os: ubuntu-24.04
            build_script: build:linux
          - platform: macos
            os: macos-15
            build_script: build:mac:unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Test renderer content isolation
        run: npm run smoke:renderer-security

      - name: Test configuration modal and Webhook controls
        run: npm run smoke:config-modal

      - name: Test AI protocol IPC through Electron
        if: runner.os != 'Linux'
        run: npm run smoke:ai-protocols

      - name: Test AI protocol IPC through Electron under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:ai-protocols

      # Hosted Windows runners do not provision an initialized Ubuntu distro.
      # Windows -> WSL is covered by smoke:local-environment on a WSL-ready host.
      - name: Test native terminal and AI execution environment
        if: runner.os == 'macOS'
        run: npm run smoke:local-environment

      - name: Test native terminal and AI execution environment under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:local-environment

      - name: Test terminal clipboard shortcuts through Electron IPC
        if: runner.os != 'Linux'
        run: npm run smoke:clipboard

      - name: Test terminal clipboard shortcuts through Electron IPC under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:clipboard

      - name: Test terminal rendering and mouse interaction
        if: runner.os != 'Linux'
        run: npm run smoke:terminal

      - name: Test documented file and command flows
        if: runner.os != 'Linux'
        run: npm run smoke:documented-flows

      - name: Test native workspaces and independent SSH sessions
        if: runner.os != 'Linux'
        run: npm run smoke:workspace

      - name: Test native workspaces and independent SSH sessions under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:workspace

      - name: Test documented file and command flows under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:documented-flows

      - name: Test real tmux panes, resize, and mouse interaction
        if: runner.os == 'Linux'
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          xvfb-run -a npm run smoke:tmux

      - name: Test plugin center and AI context isolation
        if: runner.os != 'Linux'
        run: npm run smoke:plugins

      - name: Test plugin center and AI context isolation under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:plugins

      - name: Scan source for credentials
        run: npm run security:scan

      - name: Test Webhook delivery, program exits and output matching
        if: runner.os != 'Linux'
        run: npm run smoke:notifications

      - name: Test Webhook delivery and terminal notifications under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:notifications

      - name: Test Cordis plugin host, configuration and model isolation
        if: runner.os != 'Linux'
        run: npm run smoke:plugin-runtime

      - name: Test Cordis plugin host under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:plugin-runtime

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Verify PTY in Electron
        if: runner.os != 'Linux'
        run: npm run smoke:pty

      - name: Verify PTY in Electron under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:pty

      - name: Build application
        run: npm run ${{ matrix.build_script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Windows packaged runtime
        if: runner.os == 'Windows'
        run: npm run verify:win-package

      - name: Verify packaged runtime matches this source revision
        run: npm run verify:package-source

      - name: Start packaged application
        if: runner.os != 'Linux'
        run: npm run smoke:package-startup

      - name: Start packaged application under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:package-startup

      - name: Upload package diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AITerminal-${{ matrix.platform }}-diagnostics-${{ github.sha }}
          path: |
            release/**/*.log
            release/**/*.json
            release/**/*-unpacked/**
            release/mac*/AITerminal.app/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Generate checksums
        run: npm run hash:release

      - name: Generate SBOM
        run: npm run sbom:release

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AITerminal-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/SHA256SUMS.txt
            release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified installers
    needs: build
    if: github.repository == 'Amo-Zeng/AITerminal' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: aiterminal-public-release
      cancel-in-progress: false
    steps:
      - name: Checkout verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download this run's three platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: AITerminal-*-${{ github.sha }}
          path: release/downloads

      - name: Verify artifacts and synchronize Releases download page
        run: node scripts/publishRelease.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
