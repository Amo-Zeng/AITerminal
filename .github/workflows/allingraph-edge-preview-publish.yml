name: Temporary AllInGraph Edge preview collector

on:
  workflow_run:
    workflows: [Temporary AllInGraph Edge preview build]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge-build-temp
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: allingraph-edge-*
          path: release-assets
          merge-multiple: true

      - name: Revalidate release and build checksum manifest
        run: |
          node scripts/build-edge-release-manifest.mjs \
            --input-dir release-assets \
            --output release-assets/edge-manifest.json \
            --sums-output release-assets/SHA256SUMS.txt \
            --version 0.1.0 \
            --tag edge-v0.1.0 \
            --channel preview \
            --base-url https://github.com/Amo-Zeng/AITerminal/releases/download/edge-v0.1.0
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Publish temporary unsigned preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge-v0.1.0
          name: Temporary AllInGraph Edge 0.1.0 unsigned preview
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.msi
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/edge-manifest.json
            release-assets/SHA256SUMS.txt
